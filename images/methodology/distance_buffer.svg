<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Technique: distance buffer — a single fixed-radius circle around a point; inside scores, outside doesn't. -->
  <!-- background grid -->
  <g stroke="#D6DEE4" stroke-width="2" fill="#FFFFFF">
    <rect x="20" y="20" width="40" height="40"/>
    <rect x="60" y="20" width="40" height="40"/>
    <rect x="100" y="20" width="40" height="40"/>
    <rect x="140" y="20" width="40" height="40"/>
    <rect x="20" y="60" width="40" height="40"/>
    <rect x="60" y="60" width="40" height="40"/>
    <rect x="100" y="60" width="40" height="40"/>
    <rect x="140" y="60" width="40" height="40"/>
    <rect x="20" y="100" width="40" height="40"/>
    <rect x="60" y="100" width="40" height="40"/>
    <rect x="100" y="100" width="40" height="40"/>
    <rect x="140" y="100" width="40" height="40"/>
    <rect x="20" y="140" width="40" height="40"/>
    <rect x="60" y="140" width="40" height="40"/>
    <rect x="100" y="140" width="40" height="40"/>
    <rect x="140" y="140" width="40" height="40"/>
  </g>

  <!-- cells whose centre falls inside the circle, shaded -->
  <g fill="#bce1b8" stroke="#D6DEE4" stroke-width="2">
    <rect x="60" y="60" width="40" height="40"/>
    <rect x="100" y="60" width="40" height="40"/>
    <rect x="60" y="100" width="40" height="40"/>
    <rect x="100" y="100" width="40" height="40"/>
  </g>

  <!-- the buffer ring -->
  <circle cx="100" cy="100" r="62" fill="none" stroke="#009FDA" stroke-width="3" stroke-dasharray="6,4"/>

  <!-- the facility point -->
  <circle cx="100" cy="100" r="7" fill="#002244"/>

  <!-- redraw grid outline on top so lines stay crisp -->
  <g stroke="#333333" stroke-width="2.5" fill="none">
    <rect x="20" y="20" width="180" height="180"/>
    <line x1="60" y1="20" x2="60" y2="200"/>
    <line x1="100" y1="20" x2="100" y2="200"/>
    <line x1="140" y1="20" x2="140" y2="200"/>
    <line x1="20" y1="60" x2="200" y2="60"/>
    <line x1="20" y1="100" x2="200" y2="100"/>
    <line x1="20" y1="140" x2="200" y2="140"/>
  </g>
</svg>

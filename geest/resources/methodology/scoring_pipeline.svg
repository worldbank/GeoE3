       y="20"
       width="50"
       height="38"
       rx="4"
       fill="#bce1b8"
       id="rect4" />
    <rect
       x="210"
       y="20"
       width="50"
       height="38"
       rx="4"
       fill="#2c7bb6"
       id="rect5" />

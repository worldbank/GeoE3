  <rect
     x="555"
     y="335"
     width="270"
     height="60"
     rx="6"
     fill="#FFFFFF"
     stroke="#002244"
     stroke-width="3"
     id="rect17" />
  <text
     x="690"
     y="361"
     font-family="sans-serif"
     font-size="16px"
     font-weight="bold"

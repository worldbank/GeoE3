       top, so the feed arrows run roughly horizontal instead of
       crossing diagonally through the ghost notes above. ===== -->
  <text
     x="690"
     y="300"
     font-family="sans-serif"
     font-size="16px"
     font-weight="bold"
     fill="#333333"
     text-anchor="middle"

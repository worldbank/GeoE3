       height="60"
       rx="6"
       id="rect24" />
    <rect
       x="750"
       y="650"
       width="220"
       height="60"
       rx="6"
       id="rect25" />
  </g>
  <text
     x="127"
     y="686"
     font-family="sans-serif"
     font-size="15.5"
     font-weight="bold"
     fill="#002244"
     text-anchor="middle"
     id="text25">GeoE3 score</text>
  <text
     x="367"
     y="686"
     font-family="sans-serif"
     font-size="15.5"
     font-weight="bold"

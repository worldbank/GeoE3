<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Technique: raster lookup — read the value already present on a finished map, no counting or buffering. -->
  <!-- a small continuous "map" of varying pixel values -->
  <g stroke="none">
    <rect x="20" y="20" width="24" height="24" fill="#d7191c"/>
    <rect x="44" y="20" width="24" height="24" fill="#fdae61"/>
    <rect x="68" y="20" width="24" height="24" fill="#fdae61"/>
    <rect x="92" y="20" width="24" height="24" fill="#ffffbf"/>
    <rect x="116" y="20" width="24" height="24" fill="#bce1b8"/>
    <rect x="140" y="20" width="24" height="24" fill="#bce1b8"/>
    <rect x="164" y="20" width="24" height="24" fill="#2c7bb6"/>

    <rect x="20" y="44" width="24" height="24" fill="#fdae61"/>
    <rect x="44" y="44" width="24" height="24" fill="#fdae61"/>
    <rect x="68" y="44" width="24" height="24" fill="#ffffbf"/>
    <rect x="92" y="44" width="24" height="24" fill="#ffffbf"/>
    <rect x="116" y="44" width="24" height="24" fill="#bce1b8"/>
    <rect x="140" y="44" width="24" height="24" fill="#2c7bb6"/>
    <rect x="164" y="44" width="24" height="24" fill="#2c7bb6"/>

    <rect x="20" y="68" width="24" height="24" fill="#ffffbf"/>
    <rect x="44" y="68" width="24" height="24" fill="#ffffbf"/>
    <rect x="68" y="68" width="24" height="24" fill="#bce1b8"/>
    <rect x="92" y="68" width="24" height="24" fill="#bce1b8"/>
    <rect x="116" y="68" width="24" height="24" fill="#2c7bb6"/>
    <rect x="140" y="68" width="24" height="24" fill="#2c7bb6"/>
    <rect x="164" y="68" width="24" height="24" fill="#bce1b8"/>
  </g>

  <!-- grid cell sampling one location -->
  <rect x="80" y="40" width="48" height="48" fill="none" stroke="#002244" stroke-width="4"/>
  <circle cx="104" cy="64" r="6" fill="#FFFFFF" stroke="#002244" stroke-width="2.5"/>

  <!-- arrow lifting the sampled value out to a readout -->
  <path d="M110 92 L150 145" stroke="#009FDA" stroke-width="3" fill="none" marker-end="url(#raster_lookup_arrow)"/>
  <defs>
    <marker id="raster_lookup_arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#009FDA"/>
    </marker>
  </defs>
  <rect x="130" y="150" width="50" height="34" rx="4" fill="#FFFFFF" stroke="#002244" stroke-width="2.5"/>
  <text x="155" y="172" font-family="sans-serif" font-size="14" font-weight="bold" fill="#333333" text-anchor="middle">3.2</text>
</svg>

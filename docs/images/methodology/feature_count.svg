<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Technique: counting features per cell — points/lines inside one grid cell, tallied. -->
  <rect x="40" y="30" width="120" height="120" fill="#EEF4F8" stroke="#002244" stroke-width="3"/>

  <!-- a short road/path running through the cell -->
  <path d="M50 120 C75 90, 95 130, 130 70" stroke="#6E7B85" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M60 45 L110 95" stroke="#6E7B85" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- scattered point features -->
  <g fill="#009FDA">
    <circle cx="65" cy="55" r="6"/>
    <circle cx="105" cy="45" r="6"/>
    <circle cx="140" cy="100" r="6"/>
    <circle cx="90" cy="125" r="6"/>
    <circle cx="140" cy="135" r="6"/>
  </g>

  <!-- tally badge -->
  <circle cx="168" cy="32" r="20" fill="#2c7bb6" stroke="#002244" stroke-width="2.5"/>
  <text x="168" y="38" font-family="sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">5</text>
</svg>
